[package]
name = "monarch-butterfly"
version = "0.4.1"
edition = "2021"
description = "Allocation-free, const-generic FFTs for small fixed sizes"
license = "MIT"
documentation = "https://docs.rs/monarch-butterfly"
homepage = "https://github.com/michaelciraci/Monarch-Butterfly"
repository = "https://github.com/michaelciraci/Monarch-Butterfly"
rust-version = "1.85"
keywords = ["fft", "dft", "discrete", "fourier", "no_std"]
categories = ["algorithms", "science"]
exclude = ["assets/", ".*"]

[features]
std = ["num-traits/std"]

[dependencies]
num-complex = { version = "0.4", default-features = false, features = ["libm"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
trig-const = { version = "0.4", default-features = false }

[target.'cfg(any(all(target_arch = "aarch64", target_endian = "little"), target_arch = "x86_64"))'.dependencies]
typeid = "1.0.3"

[dev-dependencies]
rustfft = "6.2.0"
